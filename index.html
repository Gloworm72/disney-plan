<style>
:root {
  --bg-dark: #0b1220; 
  --bg-panel: rgba(20, 28, 45, 0.95); 
  --accent: #38bdf8; 
  --accent-2: #f472b6;

  --text-muted: #94a3b8; 
  --good: #34d399; 
  --warn: #fbbf24;
  --bad: #f87171;
  --dl: #60a5fa; 
  --dca: #fb923c; 
  --both: #a78bfa; 
  --out: #64748b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-dark); color: var(--text-main);
  height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
}

#map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100dvh; z-index: 1; }
#map { width: 100%; height: 100%; }
#map:after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 -100px 100px -60px rgba(11,18,32,.8); }

#hud { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; right: 16px; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.hud-pill { pointer-events: auto; background: rgba(15,23,42,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 10px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 6px 16px rgba(0,0,0,.4); font-weight: 600; font-size: .85rem; display: flex; align-items: center; gap: 8px; max-width: 65%; }
#hud-status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 70% { box-shadow: 0 0 0 6px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }

#recenter-btn { pointer-events: auto; background: rgba(15,23,42,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); width: 40px; height: 40px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 6px 16px rgba(0,0,0,.4); cursor: pointer; }

#progress-track { position: absolute; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 10; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; pointer-events: none; }
#progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 4px; transition: width .2s ease; }

#bottom-sheet {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 38dvh;
  background: var(--bg-panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-top-left-radius: 24px; border-top-right-radius: 24px; z-index: 20;
  display: flex; flex-direction: column;
  transition: height 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 -12px 40px rgba(0,0,0,.6);
  border-top: 1px solid rgba(255,255,255,.1);
  padding-bottom: env(safe-area-inset-bottom);
}
#bottom-sheet.expanded { height: 88dvh; }

.sheet-handle-container { width: 100%; padding: 14px 0 10px 0; display: flex; justify-content: center; cursor: pointer; flex-shrink: 0; touch-action: none; }
.sheet-handle { width: 44px; height: 5px; background: rgba(255,255,255,.25); border-radius: 3px; }

@media (min-width: 768px) {
  #bottom-sheet { width: 420px; height: 96dvh !important; top: 2dvh; left: 16px; bottom: auto; border-radius: 24px; border: 1px solid rgba(255,255,255,.1); padding-bottom: 0; }
  .sheet-handle-container { display: none; }
  #hud, #progress-track { left: 456px; }
}

.controls-header { padding: 0 20px 14px 20px; border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
#countdown-banner { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--accent); font-size: 0.8rem; font-weight: 700; padding: 6px 12px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
#countdown-banner button { background: none; border: none; color: var(--accent); font-size: 1rem; cursor: pointer; padding: 0 4px; line-height: 1; }

.time-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.time-display-large { font-size: 2.2rem; font-weight: 800; color: var(--accent); letter-spacing: -1px; line-height: 1; }
.stats-chip { font-size: .75rem; color: var(--text-muted); font-weight: 600; background: rgba(255,255,255,.05); padding: 6px 12px; border-radius: 20px; }

.pace-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pace-badge { font-size: .75rem; font-weight: 700; padding: 5px 12px; border-radius: 14px; color: #fff; }
.pace-badge.good { background: rgba(52,211,153,.2); border: 1px solid rgba(52,211,153,.4); color: var(--good); }
.pace-badge.warn { background: rgba(251,191,36,.2); border: 1px solid rgba(251,191,36,.4); color: var(--warn); }
.pace-badge.bad { background: rgba(248,113,113,.2); border: 1px solid rgba(248,113,113,.4); color: var(--bad); }

.slider-wrap { margin: 16px 0 8px 0; }
input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); outline: none; margin: 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg-dark); box-shadow: 0 2px 8px rgba(56,189,248,.6); }

.control-buttons { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.play-btn { width: 42px; height: 42px; border-radius: 12px; border: none; background: var(--accent); color: #0f172a; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
.speed-btn { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: var(--text-muted); border-radius: 10px; padding: 8px 12px; font-size: .8rem; font-weight: 700; cursor: pointer; }
.speed-btn.active { color: var(--text-main); border-color: var(--accent); background: rgba(56,189,248,.1); }
#liveBtn { margin-left: auto; }

#itinerary { flex: 1; overflow-y: auto; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)) 16px; -webkit-overflow-scrolling: touch; }
.timeline-item { display: flex; gap: 14px; margin-bottom: 8px; padding: 12px; border-radius: 16px; cursor: pointer; background: transparent; border: 1px solid transparent; transition: background 0.2s; }
.timeline-item:active { background: rgba(255,255,255,.05); }
.timeline-item.active { background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.3); }
.timeline-item.done { opacity: 0.45; }

.time-col { font-weight: 700; color: var(--accent); min-width: 65px; font-size: .85rem; padding-top: 4px; }

.check-col { display: flex; align-items: flex-start; padding-top: 2px; }
.step-check { width: 24px; height: 24px; border-radius: 6px; border: 2px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,.05); transition: all 0.2s; }
.timeline-item.done .step-check { background: var(--accent); border-color: var(--accent); }
.timeline-item.done .step-check::after { content: ''; width: 5px; height: 10px; border: solid #0f172a; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); margin-bottom: 2px; }

.info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.info-col h4 { margin: 0 0 4px 0; font-size: 1rem; color: var(--text-main); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: .65rem; font-weight: 800; padding: 2px 6px; border-radius: 6px; color: #0f172a; text-transform: uppercase; letter-spacing: .03em; }
.info-col p { margin: 0; font-size: .8rem; color: var(--text-muted); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.live-wait { font-size: .75rem; font-weight: 700; color: #fff; background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 12px; margin-left: auto; display: flex; align-items: center; gap: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
.live-wait.good::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good); }
.live-wait.med::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.live-wait.bad::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 6px var(--bad); }
.live-wait.closed::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }

.badge.dl { background: var(--dl); } .badge.dca { background: var(--dca); } .badge.both { background: var(--both); } .badge.out { background: var(--out); }
.marker-pin { width: 14px; height: 14px; border-radius: 50%; background: rgba(15,23,42,.9); border: 2px solid rgba(255,255,255,.8); box-shadow: 0 0 0 3px rgba(0,0,0,.2); }
.marker-pin.dl { border-color: var(--dl); } .marker-pin.dca { border-color: var(--dca); } .marker-pin.both { border-color: var(--both); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }
</style>
</head>
<body>

<div id="map-container">
  <div id="map"></div>
  <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
  <div id="hud">
    <div class="hud-pill"><span class="pulse-dot"></span><span id="hud-status">Loading route…</span></div>
    <div id="recenter-btn" aria-label="Recenter map">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f8fafc" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </div>
  </div>
</div>

<div id="bottom-sheet">
  <div class="sheet-handle-container" id="sheet-handle"><div class="sheet-handle"></div></div>

      <span id="cd-text">Calculating...</span>
      <button onclick="this.parentElement.style.display='none'">✕</button>
    </div>

    <div class="time-row">
      <div class="time-display-large" id="mainTimeStr">07:15 AM</div>
      <div class="stats-chip" id="mainStats">0 / 0 stops</div>
    </div>
    
    <div class="pace-row" id="paceRow"></div>

      <input type="range" id="timeSlider" min="-45" max="960" value="-45" step="1">
    </div>

      <button class="play-btn" id="playBtn">▶</button>
      <button class="speed-btn" data-speed="15">×15</button>

      <button class="speed-btn" id="liveBtn" data-speed="live">Live</button>
    </div>
  </div>
  
  <div id="itinerary"></div>
</div>

<script>
const POIS = {
  "Mickey & Friends Parking": [33.8121,-117.9255,"Out"],
  "DCA Gates": [33.8087,-117.9189,"DCA"],
  "DL Gates": [33.8095,-117.9189,"DL"],
  "Esplanade": [33.8091,-117.9189,"Both"],
  "Radiator Springs Racers": [33.8041,-117.9188,"DCA"],
  "WEB Slingers": [33.8071,-117.9174,"DCA"],
  "Guardians of the Galaxy": [33.8078,-117.9170,"DCA"],
  "Spiderman Stuntronic": [33.8068,-117.9177,"DCA"],
  "Soarin' Across America": [33.8078,-117.9202,"DCA"],
  "Grizzly River Run": [33.8058,-117.9204,"DCA"],
  "The Little Mermaid": [33.8053,-117.9213,"DCA"],
  "Toy Story Midway Mania!": [33.8045,-117.9220,"DCA"],
  "Incredicoaster": [33.8037,-117.9218,"DCA"],
  "Rise of the Resistance": [33.8136,-117.9215,"DL"],
  "Smugglers Run": [33.8143,-117.9204,"DL"],
  "Big Thunder Mountain": [33.8123,-117.9207,"DL"],
  "Tiana's Bayou Adventure": [33.8124,-117.9238,"DL"],
  "Pirates of the Caribbean": [33.8113,-117.9205,"DL"],
  "Indiana Jones Adventure": [33.8115,-117.9210,"DL"],
  "Jungle Cruise": [33.8115,-117.9198,"DL"],
  "Space Mountain": [33.8111,-117.9168,"DL"],
  "Matterhorn Bobsleds": [33.8127,-117.9174,"DL"],
  "Mr. Toad's Wild Ride": [33.8131,-117.9187,"DL"],
  "Mad Tea Party": [33.8132,-117.9180,"DL"],
  "Runaway Railway": [33.8145,-117.9184,"DL"],
  "it's a small world": [33.8142,-117.9179,"DL"],
  "Star Tours": [33.8116,-117.9179,"DL"],
  "Buzz Lightyear": [33.8112,-117.9179,"DL"],
  "Winnie the Pooh": [33.8123,-117.9248,"DL"],
  "Peter Pan's Flight": [33.8130,-117.9189,"DL"],
  "Ronto Roasters": [33.8136,-117.9201,"DL"],
  "Oga's Cantina": [33.8140,-117.9201,"DL"],
  "Tiki Room & Dole Whip": [33.8113,-117.9192,"DL"],
  "Cars Land": [33.8051,-117.9189,"DCA"],
  "Bengal BBQ": [33.8118,-117.9192,"DL"],
  "Castle (Fireworks)": [33.8121,-117.9189,"DL"],
  "Fantasmic! (Rivers of America)": [33.8123,-117.9221,"DL"]
};

// [Standby Wait, Is Headliner, Ride Duration]
const ATTRACTIONS = {
  "Radiator Springs Racers":[110,true,6], "Guardians of the Galaxy":[85,true,5],
  "WEB Slingers":[70,true,5], "Toy Story Midway Mania!":[65,true,8],
  "Soarin' Across America":[60,false,7], "Incredicoaster":[50,false,5],
  "Grizzly River Run":[45,false,7], "The Little Mermaid":[20,false,7],
  "Rise of the Resistance":[120,true,18], "Indiana Jones Adventure":[80,true,5],
  "Space Mountain":[90,true,5], "Runaway Railway":[70,true,6],
  "Big Thunder Mountain":[55,false,4], "Smugglers Run":[60,false,6],
  "Pirates of the Caribbean":[45,false,15], "Tiana's Bayou Adventure":[70,true,10],
  "Matterhorn Bobsleds":[55,false,4], "Jungle Cruise":[40,false,8],
  "Star Tours":[35,false,7], "Buzz Lightyear":[35,false,5],
  "it's a small world":[30,false,15], "Mr. Toad's Wild Ride":[30,false,3],
  "Mad Tea Party":[20,false,3], "Winnie the Pooh":[20,false,4], 
  "Peter Pan's Flight":[65,true,3], "Spiderman Stuntronic":[15,false,10]
};

const SEQUENCE = [
  ["Guardians of the Galaxy","Rope Drop / Riding"],
  ["Radiator Springs Racers","Riding (Single Pass)"],
  ["Incredicoaster","Riding"],
  ["Toy Story Midway Mania!","Riding"],
  ["The Little Mermaid","Riding (Standby)"],
  ["Soarin' Across America","Riding"],
  ["Grizzly River Run","Riding"],
  ["WEB Slingers","Riding"],
  ["Spiderman Stuntronic","Watching Show"],
  
  ["Esplanade","Park Hopping to DL"],
  ["Indiana Jones Adventure","Riding"],
  ["Pirates of the Caribbean","Riding (Standby)"],
  ["Tiana's Bayou Adventure","Riding"],
  ["Smugglers Run","Riding"],
  ["Ronto Roasters","Lunch Break (Mobile Order)"],
  ["Oga's Cantina","Drinks (Standby Line)"],
  
  ["Runaway Railway","Riding"],
  ["it's a small world","Riding"],
  ["Matterhorn Bobsleds","Riding"],
  ["Space Mountain","Riding"],
  ["Star Tours","Riding"],
  ["Buzz Lightyear","Riding"],
  ["Tiki Room & Dole Whip","Snack & Show"],
  
  ["Jungle Cruise","Riding"],
  ["Big Thunder Mountain","Riding"],
  ["Winnie the Pooh","Riding (Standby)"],
  
  ["Esplanade","Park Hopping to DCA for Sunset"],
  ["Cars Land","Sh-Boom! Sunset Lighting Moment"],
  
  ["Esplanade","Park Hopping to DL"],
  ["Bengal BBQ","Quick Service Dinner"],
  
  ["Castle (Fireworks)","Watching Fireworks"],
  ["Fantasmic! (Rivers of America)","Waiting for Fantasmic"],
  
  ["Rise of the Resistance","Night Ride (Single Pass)"],
  ["Mr. Toad's Wild Ride","Riding (Standby)"],
  ["Mad Tea Party","Final Ride of Night"]
];

function calcDist(a,b){
  const [lat1,lon1] = POIS[a], [lat2,lon2] = POIS[b];
  return Math.hypot(lat2-lat1, lon2-lon1) * 1800;
}

function generateRoute(){
  let timeM = -45;
  let loc = "Mickey & Friends Parking";
  const schedule = [{time:timeM, loc, desc:"Park & Security"}];

  timeM += 15; loc = "DCA Gates";
  schedule.push({time:timeM, loc, desc:"Queue for Rope Drop"});
  timeM = 0;

  for (const [nextLoc, desc] of SEQUENCE){
    if(nextLoc === "Castle (Fireworks)") {
        if (timeM < 815) timeM = 815; 
    } else if (nextLoc === "Fantasmic! (Rivers of America)") {
        if (timeM < 855) timeM = 855; 
    } else {
        timeM += calcDist(loc, nextLoc);
    }
    
    loc = nextLoc;

    if (loc === "Spiderman Stuntronic" && timeM < 120) timeM = 120;
    if (loc === "Cars Land" && timeM < 700) timeM = 700;

    let wait = 0, dur = 15;
    if (ATTRACTIONS[loc]){
      dur = ATTRACTIONS[loc][2];
      if (!desc.includes("Standby")) wait = ATTRACTIONS[loc][1] ? 10 : 5;
      else wait = ATTRACTIONS[loc][0];
    }
    
    if (loc === "Oga's Cantina") wait = 15;
    if (loc === "Ronto Roasters" || loc === "Bengal BBQ") dur = 35;
    if (loc === "Cars Land") dur = 10;
    if (loc === "Castle (Fireworks)") dur = 20;
    if (loc === "Fantasmic! (Rivers of America)") dur = 45;

    schedule.push({time:timeM, loc, desc});
    timeM += wait + dur;
    if (timeM >= 960) break; 
  }
  return schedule;
}

const routeData = generateRoute();
const RENDER_INTERVAL = 1000 / 30;

let currentTime = -45;
let playing = false;
let playSpeed = 30; 
let liveMode = false;
let rafId = null;
let lastFrame = null;
let lastRender = null;

let liveApiData = {};
let checkedStops = JSON.parse(localStorage.getItem('disneyProgress')) || [];

let pathCache = [];
let pathCacheEndTime = null;

function syncPath(upToTime){
  const start = routeData[0].time;
  if (pathCacheEndTime === null){
    pathCache = [];
    pathCacheEndTime = start - 3;
  }
  if (upToTime < pathCacheEndTime){
    const keepCount = Math.max(0, Math.floor((upToTime - start) / 3) + 1);
    pathCache.length = keepCount;
    pathCacheEndTime = keepCount > 0 ? start + (keepCount - 1) * 3 : start - 3;
  }
  for (let t = pathCacheEndTime + 3; t <= upToTime; t += 3){
    const p = getPosition(t);
    pathCache.push([p.lon, p.lat]);
  }
  pathCacheEndTime = upToTime;
}

function formatTime(mins){
  const realMins = mins >= 0 ? mins : (60 + mins);
  let h = mins >= 0 ? Math.floor(mins/60) + 8 : 7;
  const m = Math.floor(realMins % 60);
  const ampm = (h < 12 || h >= 24) ? "AM" : "PM";
  if (h > 12) h -= 12;
  if (h === 0) h = 12;
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function formatPace(mins) {
    const absMins = Math.abs(Math.round(mins));
    const h = Math.floor(absMins / 60);
    const m = absMins % 60;
    if (h > 0) return `${h}h ${m}m`;
    return `${m} min`;
}

function realWorldMinutes(){
  const now = new Date();
  return (now.getHours() - 8) * 60 + now.getMinutes();
}

function saveProgress() {
    localStorage.setItem('disneyProgress', JSON.stringify(checkedStops));
    updatePaceTracker();
}

function updateCountdown() {
    const target = new Date('2026-08-15T00:00:00').getTime();
    const now = new Date().getTime();
    const diff = target - now;
    if (diff > 0) {
        const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        document.getElementById('cd-text').innerText = `${days} days until Disney!`;
    } else {
        document.getElementById('countdown-banner').style.display = 'none';
    }
}
updateCountdown();

function fetchLiveWaits() {
  const dlId = '7340550b-c14d-4def-80bb-acdb51d49a66';
  const dcaId = '832fcd51-ea19-4e77-85c7-75d5843b127c';
  
  Promise.all([
    fetch(`https://api.themeparks.wiki/v1/entity/${dlId}/live`).then(r => r.json()).catch(() => ({liveData:[]})),
    fetch(`https://api.themeparks.wiki/v1/entity/${dcaId}/live`).then(r => r.json()).catch(() => ({liveData:[]}))
  ]).then(([dlData, dcaData]) => {
    const allRides = [...dlData.liveData, ...dcaData.liveData];
    allRides.forEach(ride => {
      const n = ride.name.toLowerCase();
      let matchName = null;
      for (const key of Object.keys(ATTRACTIONS)) {
        if (n.includes(key.toLowerCase())) { matchName = key; break; }
        if (key === "Incredicoaster" && n.includes("incredicoaster")) matchName = key;
        if (key === "Toy Story Midway Mania!" && n.includes("toy story midway mania")) matchName = key;
        if (key === "WEB Slingers" && n.includes("web slingers")) matchName = key;
        if (key === "Rise of the Resistance" && n.includes("rise of the resistance")) matchName = key;
        if (key === "Smugglers Run" && n.includes("smugglers run")) matchName = key;
        // Accurate Soarin match
        if (key.includes("Soarin") && (n.includes("soarin") || n.includes("california") || n.includes("america"))) matchName = key;
      }
      if (matchName) {
        liveApiData[matchName] = {
          status: ride.status,
          wait: ride.queue ? ride.queue.STANDBY.waitTime : null
        };
      }
    });
    populateTimeline();
  });
}

function getWaitBadgeHtml(loc) {
  if (!liveApiData[loc]) return '';
  const data = liveApiData[loc];
  if (data.status === 'CLOSED' || data.status === 'DOWN') return `<div class="live-wait closed">Closed</div>`;
  if (data.wait !== null) {
    let colorClass = 'good';
    if (data.wait >= 45) colorClass = 'med';
    if (data.wait >= 75) colorClass = 'bad';
    return `<div class="live-wait ${colorClass}">${data.wait}m</div>`;
  }
  return '';
}

function badgeClass(park){ return park.toLowerCase(); }

function populateTimeline(){
  let html = '';
  routeData.forEach((item, index) => {
    const park = POIS[item.loc] ? POIS[item.loc][2] : 'Out';
    const isChecked = checkedStops.includes(item.loc + item.time);
    const doneClass = isChecked ? 'done' : '';
    const waitBadge = getWaitBadgeHtml(item.loc);
    
    html += `<div class="timeline-item ${doneClass}" id="item-${index}">
      <div class="time-col" onclick="jumpTo(${item.time})">${formatTime(item.time)}</div>
      <div class="check-col">
        <div class="step-check" data-id="${item.loc + item.time}"></div>
      </div>
      <div class="info-col" onclick="jumpTo(${item.time})">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4>${item.loc}<span class="badge ${badgeClass(park)}">${park}</span></h4>
            ${waitBadge}
        </div>
        <p>${item.desc}</p>
      </div>
    </div>`;
  });
  
  document.getElementById('itinerary').innerHTML = html;
  
  document.querySelectorAll('.step-check').forEach(el => {
      el.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = el.dataset.id;
          if (checkedStops.includes(id)) {
              checkedStops = checkedStops.filter(i => i !== id);
              el.closest('.timeline-item').classList.remove('done');
          } else {
              checkedStops.push(id);
              el.closest('.timeline-item').classList.add('done');
          }
          saveProgress();
      });
  });
}

function updatePaceTracker() {
    const rwm = realWorldMinutes();
    const paceEl = document.getElementById('paceRow');
    
    if (rwm < -45 || rwm > 960) {
        paceEl.innerHTML = '';
        return;
    }
    
    let nextTargetTime = null;
    let nextTargetLoc = null;
    for (const item of routeData) {
        if (!checkedStops.includes(item.loc + item.time)) {
            nextTargetTime = item.time;
            nextTargetLoc = item.loc;
            break;
        }
    }
    
    if (nextTargetTime === null) {
        paceEl.innerHTML = `<div class="pace-badge good">All caught up!</div>`;
        return;
    }
    
    const diff = nextTargetTime - rwm;
    const formattedDiff = formatPace(diff);
    
    if (diff > 0) {
        paceEl.innerHTML = `<div class="pace-badge good">${formattedDiff} ahead of schedule</div>`;
    } else if (diff === 0) {
        paceEl.innerHTML = `<div class="pace-badge good">Right on time</div>`;
    } else {
        const cls = Math.abs(diff) > 20 ? 'bad' : 'warn';
        paceEl.innerHTML = `<div class="pace-badge ${cls}">${formattedDiff} behind schedule</div>`;
    }
}

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { satellite: { type:'raster', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256 } },
    layers: [{ id:'satellite-layer', type:'raster', source:'satellite', minzoom:0, maxzoom:22 }]
  },
  center: [-117.9190, 33.8105],
  zoom: 16.2, pitch: 55, bearing: -20,
  attributionControl: false
});

let userIsPanning = false;
map.on('dragstart', () => userIsPanning = true);

map.on('load', () => {
  for (const [name, coords] of Object.entries(POIS)){
    const el = document.createElement('div');
    el.className = 'marker-pin ' + badgeClass(coords[2]);
    new maplibregl.Marker({element: el}).setLngLat([coords[1], coords[0]]).addTo(map);
  }

  map.addSource('route', { type:'geojson', data:{type:'Feature', geometry:{type:'LineString', coordinates:[]}} });
  map.addLayer({ id:'route-line', type:'line', source:'route', layout:{'line-join':'round','line-cap':'round'}, paint:{'line-color':'#38bdf8','line-width':6,'line-opacity':.85} });

  map.addSource('user', { type:'geojson', data:{type:'Feature', geometry:{type:'Point', coordinates:[-117.9255,33.8121]}} });
  map.addLayer({ id:'user-point', type:'circle', source:'user', paint:{'circle-radius':10,'circle-color':'#38bdf8','circle-stroke-width':3,'circle-stroke-color':'#ffffff','circle-pitch-alignment':'map'} });

  fetchLiveWaits();
  populateTimeline();
  initLiveDefault();
  updateUI(true);
});

function getPosition(t){
  const d = routeData;
  if (t <= d[0].time) return { lon:POIS[d[0].loc][1], lat:POIS[d[0].loc][0], loc:d[0].loc, desc:d[0].desc };
  if (t >= d[d.length-1].time){ const last = d[d.length-1]; return { lon:POIS[last.loc][1], lat:POIS[last.loc][0], loc:last.loc, desc:last.desc }; }

  for (let i=0; i<d.length-1; i++){
    if (t >= d[i].time && t <= d[i+1].time){
      const p1 = POIS[d[i].loc], p2 = POIS[d[i+1].loc];
      if (d[i].loc === d[i+1].loc) return { lon:p1[1], lat:p1[0], loc:d[i].loc, desc:d[i].desc };
      const walkStart = d[i+1].time - 10;
      if (t < walkStart) return { lon:p1[1], lat:p1[0], loc:d[i].loc, desc:d[i].desc };
      const progress = Math.min(1, Math.max(0, (t - walkStart) / 10));
      return { lon:p1[1] + (p2[1]-p1[1])*progress, lat:p1[0] + (p2[0]-p1[0])*progress, loc:`Walking to ${d[i+1].loc}`, desc:'Transit' };
    }
  }
  return { lon:-117.919, lat:33.8105, loc:'', desc:'' };
}

function updateUI(flyCamera=false){
  const pos = getPosition(currentTime);

  document.getElementById('mainTimeStr').textContent = formatTime(currentTime);
  document.getElementById('mainStats').textContent = `${checkedStops.length} / ${routeData.length} stops`;
  document.getElementById('hud-status').textContent = pos.desc === 'Transit' ? pos.loc : `${pos.loc} · ${pos.desc}`;

  const total = routeData[routeData.length-1].time - routeData[0].time;
  const pct = Math.min(100, Math.max(0, ((currentTime - routeData[0].time) / total) * 100));
  document.getElementById('progress-fill').style.width = pct + '%';

  let activeIdx = 0;
  for (let i=0; i<routeData.length; i++){ if (currentTime >= routeData[i].time) activeIdx = i; }

  document.querySelectorAll('.timeline-item').forEach((el, i) => {
      if (i === activeIdx) {
          el.classList.add('active');
          if (flyCamera) el.scrollIntoView({behavior:'smooth', block:'center'});
      } else {
          el.classList.remove('active');
      }
  });

  if (map.isStyleLoaded()){
    map.getSource('user').setData({type:'Feature', geometry:{type:'Point', coordinates:[pos.lon,pos.lat]}});
    
    syncPath(currentTime);
    map.getSource('route').setData({type:'Feature', geometry:{type:'LineString', coordinates: pathCache }});

    if (!userIsPanning){
      if (flyCamera) map.easeTo({center:[pos.lon,pos.lat], duration:700, zoom:16.5});
      else map.jumpTo({center:[pos.lon,pos.lat]});
    }
  }
}

function jumpTo(time){
  currentTime = time;
  document.getElementById('timeSlider').value = time;
  if (window.innerWidth < 768) sheet.classList.remove('expanded');
  stopPlaying();
  updateUI(true);
}

document.getElementById('recenter-btn').addEventListener('click', () => {
  userIsPanning = false;
  updateUI(true);
});

document.getElementById('timeSlider').addEventListener('input', (e) => {
  currentTime = parseInt(e.target.value, 10);
  stopPlaying();
  updateUI(false);
});

function stopPlaying(){
  playing = false;
  liveMode = false;
  document.getElementById('liveBtn').classList.remove('active');
  document.getElementById('playBtn').textContent = '▶';
  if (rafId) cancelAnimationFrame(rafId);
  lastFrame = null;
  lastRender = null;
}

function tick(ts){
  if (!playing) return;
  if (lastFrame === null) lastFrame = ts;
  const dt = (ts - lastFrame) / 1000;
  lastFrame = ts;
  currentTime = Math.min(960, currentTime + dt * playSpeed);
  
  if (lastRender === null || ts - lastRender >= RENDER_INTERVAL){
    lastRender = ts;
    document.getElementById('timeSlider').value = currentTime;
    updateUI(false);
  }
  
  if (currentTime >= 960){ stopPlaying(); return; }
  rafId = requestAnimationFrame(tick);
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (playing){ stopPlaying(); return; }
  playing = true;
  document.getElementById('playBtn').textContent = '❚❚';
  lastFrame = null;
  rafId = requestAnimationFrame(tick);
});

document.querySelectorAll('.speed-btn[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.speed === 'live'){
      liveMode = !liveMode;
      btn.classList.toggle('active', liveMode);
      if (liveMode){ playing = false; document.getElementById('playBtn').textContent = '▶'; syncToRealTime(); }
      return;
    }
    document.querySelectorAll('.speed-btn[data-speed]').forEach(b => { if (b.dataset.speed !== 'live') b.classList.remove('active'); });
    btn.classList.add('active');
    playSpeed = parseInt(btn.dataset.speed, 10);
  });
});

function syncToRealTime(){
  if (!liveMode) return;
  currentTime = Math.max(-45, Math.min(960, realWorldMinutes()));
  document.getElementById('timeSlider').value = currentTime;
  updateUI(true);
  updatePaceTracker();
  setTimeout(syncToRealTime, 15000);
}

function initLiveDefault(){
  const rwm = realWorldMinutes();
  if (rwm >= -45 && rwm <= 960){
    liveMode = true;
    document.getElementById('liveBtn').classList.add('active');
    currentTime = rwm;
    document.getElementById('timeSlider').value = currentTime;
    syncToRealTime();
  }
  updatePaceTracker();
}

const sheet = document.getElementById('bottom-sheet');
document.getElementById('sheet-handle').addEventListener('click', () => {
    sheet.classList.toggle('expanded');
});

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
